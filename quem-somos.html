<script>
document.addEventListener("DOMContentLoaded", async () => {
  const A = window.App, S = window.STORE, esc = A.esc, icon = A.icon;
  document.getElementById("sobre").innerHTML = "<h2>Nossa história</h2>" + S.sobre.map((p) => "<p>" + esc(p) + "</p>").join("") + "";

  const soc = document.getElementById("social"); soc.innerHTML = A.socialRow(); soc.querySelectorAll(".social-row a").forEach((a) => { a.style.background = "#17171a"; });
  try {
    const d = await A.loadIndex(); const marcas = new Set(d.veiculos.map((v) => v.marca));
    document.getElementById("stats").innerHTML = "<div><b>" + d.veiculos.length + "</b><span style=\"color:#6b6b73\">veículos hoje</span></div><div><b>" + marcas.size + "</b><span style=\"color:#6b6b73\">marcas</span></div><div><b>100%</b><span style=\"color:#6b6b73\">laudo aprovado</span></div>";
  } catch (e) { document.getElementById("stats").hidden = true; }
});
</script>
