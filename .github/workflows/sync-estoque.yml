name: Sincronizar estoque

# Atualiza data/*.json, v/*.html, sitemap.xml e assets/thumbs a partir de iguatemiautomoveis.com.br
# e faz commit. Roda todo dia às 06:00 (Brasília) ou manualmente em Actions > Sincronizar estoque > Run workflow.
#
# Publicação: o Vercel (vercel.json) faz o deploy sozinho a cada push, inclusive este commit, e recalcula
# as URLs absolutas com o domínio do projeto. O job "publicar" (GitHub Pages) só roda se a variável de
# repositório PUBLICAR_GITHUB_PAGES for "true" (Settings > Secrets and variables > Actions > Variables).
# Nesse caso, defina também SITE_URL com a URL final, ex.: https://www.seudominio.com.br/
on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sync-estoque
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      mudou: ${{ steps.commit.outputs.mudou }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: node scripts/sync-inventory.mjs
      - run: node scripts/gerar-paginas.mjs --site-url "${{ vars.SITE_URL || 'https://marcusbarbosa92.github.io/IguatemiVeiculos/' }}"
      - run: python3 scripts/gerar-miniaturas.py
      - run: python3 scripts/sync-instagram.py
        env:
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
      - run: node tests/validar-dados.mjs
      - name: Commit se o estoque mudou
        id: commit
        run: |
          # ignora linhas que mudam todo dia (data de atualização e lastmod do sitemap)
          if git diff --quiet -I 'atualizadoEm' -I '<lastmod>' -- data v sitemap.xml robots.txt ':(glob)*.html' assets/thumbs assets/fotos assets/og assets/marcas assets/instagram \
             && [ -z "$(git ls-files --others --exclude-standard -- v assets/thumbs assets/fotos assets/og assets/marcas assets/instagram)" ]; then
            echo "Estoque sem mudanças."; git checkout -- . ; echo "mudou=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data v sitemap.xml robots.txt ':(glob)*.html' assets/thumbs assets/fotos assets/og assets/marcas assets/instagram
          git commit -m "chore: sincroniza estoque ($(date -u +%Y-%m-%d))"
          git push
          echo "mudou=true" >> "$GITHUB_OUTPUT"

  # GitHub Pages (opcional): pushes feitos com o GITHUB_TOKEN não disparam outros workflows, então a
  # publicação acontece aqui mesmo. O Vercel não precisa disso: ele reage ao push por conta própria.
  publicar:
    needs: sync
    if: needs.sync.outputs.mudou == 'true' && vars.PUBLICAR_GITHUB_PAGES == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
