name: Sincronizar estoque

# Vigia o estoque da loja na AutoCerto (iguatemiautomoveis.com.br) e publica as mudanças em poucos minutos.
#
# Como funciona: cada execução é um "vigia" que fica ativo por quase 6 horas (o máximo de um job). Ao
# começar, faz uma sincronização completa (estoque, páginas, miniaturas, YouTube, Instagram). Depois, a
# cada 5 minutos, confere só a listagem (duas requisições: listagem e home) e, se algo mudou (veículo
# novo, vendido, preço ou capa), faz a sincronização completa e commita. Ao terminar o turno, dispara a
# próxima execução, e assim a vigilância nunca para. O workflow "Manter a vigilância do estoque"
# (vigia-estoque.yml) confere de hora em hora se há um vigia ativo e, se não houver, inicia um.
#
# Por que assim e não um cron de 5 em 5 minutos: o agendador do GitHub tem prioridade baixa e atrasa
# (neste repositório, a execução diária das 09:00 UTC chegou a rodar às 13:24). Um job contínuo respeita
# o intervalo de 5 minutos; só o atraso do próprio GitHub para iniciar a execução seguinte fica fora do
# nosso controle. Actions é gratuito em repositório público.
#
# Publicação: o Vercel (vercel.json) faz o deploy sozinho a cada push, inclusive os commits deste job.
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write   # para disparar a próxima execução

concurrency:
  group: sync-estoque
  cancel-in-progress: false

jobs:
  vigiar:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      SITE_URL: ${{ vars.SITE_URL || 'https://iguatemi-veiculos.vercel.app/' }}
      INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
      DURACAO_MIN: 340       # duração do turno; depois disso, passa o bastão para a próxima execução
      INTERVALO_S: 300       # 5 minutos entre conferências
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - name: Sincronização completa ao iniciar o turno
        run: bash scripts/sincronizar.sh --site-url "$SITE_URL" || echo "::warning::a sincronização completa falhou; o vigia continua e tenta de novo na próxima mudança"
      - name: Vigiar a listagem a cada 5 minutos
        run: |
          fim=$(( $(date +%s) + DURACAO_MIN * 60 ))
          n=0
          while [ "$(date +%s)" -lt "$fim" ]; do
            sleep "$INTERVALO_S"
            n=$((n + 1))
            git pull -q --rebase || true   # pega commits feitos por fora (YouTube, ajustes no site)
            if saida=$(node scripts/sync-inventory.mjs --check-only 2>&1); then
              echo "[$(date -u +%H:%M)] #$n $(echo "$saida" | grep '^check:')"
              if echo "$saida" | grep -q '^mudou=true'; then
                bash scripts/sincronizar.sh --site-url "$SITE_URL" || echo "::warning::sincronização falhou às $(date -u +%H:%M); tento de novo na próxima mudança"
              fi
            else
              echo "::warning::[$(date -u +%H:%M)] conferência falhou: $(echo "$saida" | tail -1)"
            fi
          done
          echo "Turno encerrado após $n conferências."
      - name: Passar o bastão para a próxima execução
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run sync-estoque.yml --ref "$GITHUB_REF_NAME"
