name: Sincronizar estoque

# Atualiza data/vehicles.json e data/index.json a partir de iguatemiautomoveis.com.br.
# Roda manualmente (Actions > Sincronizar estoque > Run workflow) ou todo dia às 06:00 (horário de Brasília).
on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/sync-inventory.mjs
      - name: Commit se houver mudanças
        run: |
          if git diff --quiet -- data; then echo "Estoque sem mudanças."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "chore: sincroniza estoque ($(date -u +%Y-%m-%d))"
          git push
